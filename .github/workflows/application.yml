name: Application release checks

on:
  push:
    paths-ignore:
      - "docs/**"
      - "exa-results/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "exa-results/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STUDIO_SANDBOX_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify:studio
